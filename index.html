<!DOCTYPE html>
<html lang="de">

            display: flex;
            justify-content: center;

        .container {
            text-align: center;

        p { color: #94a3b8; font-size: 1.2rem; }
        .badge {
            display: inline-block;
            background: #0ea5e9;
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            margin-top: 1rem;
        }

<body>
    <div class="container">
        <h1>Leon Wolf</h1>
